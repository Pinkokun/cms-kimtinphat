name = "cms-kimtinphat"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "kimtinphat-web-db"
database_id = "da0bae78-09bf-40aa-9412-1325bd3b48ef"
migrations_dir = "./node_modules/@sonicjs-cms/core/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "kimtinphat-web-media"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "c1b3891fc79a46129071b7facdb73c2e"

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://kimtinphat-web.pages.dev,https://cms-kimtinphat.tranhuunghia2002.workers.dev"
BETTER_AUTH_URL = "https://cms-kimtinphat.tranhuunghia2002.workers.dev"